services:
  app:
    build: .
    container_name: image-processing-service
    ports:
      - "3000:3000"
    env_file:
      - .docker.env
    depends_on:
      - mongo
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: image-processing-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
